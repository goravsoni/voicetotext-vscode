<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Microphone body -->
  <rect x="50" y="24" width="28" height="48" rx="14" fill="white"/>
  <!-- Microphone arc -->
  <path d="M36 60 a28 28 0 0 0 56 0" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Stand -->
  <line x1="64" y1="88" x2="64" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <line x1="50" y1="100" x2="78" y2="100" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M96 40 a20 24 0 0 1 0 32" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M104 32 a28 36 0 0 1 0 48" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
</svg>
